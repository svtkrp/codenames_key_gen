<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Codenames Key</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #101218;
    }

    body {
      margin: 0;
      min-width: 100%;
      min-height: 100%;

      font-family: Arial, Helvetica, sans-serif;

      background: #101218;
      color: white;
    }

    .board {
      width: 100vw;

      height: 100vh;
      height: 100dvh;

      display: grid;

      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);

      gap: 10px;

      padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));

      background:
        linear-gradient(
          180deg,
          #171b24,
          #101218
        );
    }

    .card {
      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      overflow: hidden;
      user-select: none;

      box-shadow:
        inset 0 2px 2px rgba(255,255,255,0.14),
        inset 0 -3px 7px rgba(0,0,0,0.16),
        0 3px 8px rgba(0,0,0,0.16);
    }

    .card.red {
      background:
        linear-gradient(
          145deg,
          #ef5555,
          #bd2525
        );
    }

    .card.blue {
      background:
        linear-gradient(
          145deg,
          #4a97ed,
          #2262b5
        );
    }

    .card.civilian {
      background:
        linear-gradient(
          145deg,
          #d7c7a6,
          #a99570
        );
    }

    .card.assassin {
      background:
        linear-gradient(
          145deg,
          #333842,
          #090a0d
        );
    }

    .emoji {
      font-size: 26px;
      line-height: 1;

      pointer-events: none;

      filter:
        drop-shadow(
          0 2px 2px rgba(0, 0, 0, 0.35)
        );
    }

    .controls-wrap {
      width: 100%;

      padding:
        24px
        max(18px, env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

      background: #101218;
    }

    .controls {
      width: min(100%, 380px);

      margin: 0 auto;

      display: flex;
      align-items: stretch;
      justify-content: center;

      gap: 12px;
    }

    #seedInput {
      flex: 1;
      min-width: 0;
      max-width: 280px;

      height: 54px;

      padding: 0 18px;

      border:
        1px solid rgba(255,255,255,0.16);

      border-radius: 14px;
      outline: none;

      background:
        rgba(255,255,255,0.09);

      color: white;

      font-family: monospace;
      font-size: 26px;
      font-weight: 700;

      letter-spacing: 4px;

      text-align: center;
    }

    #seedInput:focus {
      border-color:
        rgba(255,255,255,0.45);
    }

    #generateButton {
      width: 64px;
      height: 54px;

      flex: 0 0 64px;

      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 14px;

      background: white;
      color: #151820;

      cursor: pointer;
    }

    #generateButton:active {
      transform: scale(0.97);
    }

    #generateButton span {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      font-size: 30px;
      line-height: 1;

      position: relative;
      top: -3px;
    }

    @media (orientation: landscape) {
      .board {
        gap: 9px;
      }

      .card {
        border-radius: 13px;
      }

      .emoji {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div
    class="board"
    id="board"
  ></div>

  <div class="controls-wrap">

    <div class="controls">

      <input
        id="seedInput"
        type="text"
        maxlength="2"
        inputmode="numeric"
        autocomplete="off"
        spellcheck="false"
      >

      <button
        id="generateButton"
        aria-label="Открыть ключ"
        title="Открыть ключ"
      >
        <span>→</span>
      </button>

    </div>

  </div>


  <script>

    const board =
      document.getElementById("board");

    const seedInput =
      document.getElementById("seedInput");

    const generateButton =
      document.getElementById("generateButton");


    const baseKeys = [

      [
        "BRBNB",
        "RBRNR",
        "RNRXN",
        "BRBNB",
        "NNRBR"
      ],

      [
        "RBRNN",
        "NRBNB",
        "BNBRR",
        "NRNXB",
        "RBRBR"
      ],

      [
        "BNNRB",
        "RBNBR",
        "NRBRX",
        "RBNNB",
        "NRBRR"
      ],

      [
        "RNBRB",
        "NBRNR",
        "RBXBN",
        "NRRBR",
        "RNBNB"
      ],

      [
        "BRBRR",
        "RNRXN",
        "NBNRB",
        "RNBNR",
        "BBNRB"
      ],

      [
        "RNBXB",
        "NRNRR",
        "BNBNB",
        "RBRRN",
        "BRNBR"
      ],

      [
        "BNBRN",
        "RBRBR",
        "RBNNR",
        "NNBXB",
        "RBRNR"
      ],

      [
        "BNRBR",
        "NRBRN",
        "RBNXR",
        "BNRNB",
        "RRBBN"
      ],

      [
        "RNNRB",
        "BBNBN",
        "NRRNR",
        "BXNRB",
        "RBRBR"
      ],

      [
        "RNBNB",
        "XBRBR",
        "RNRNR",
        "BNBRN",
        "NRBRB"
      ]

    ];


    function rotate90(matrix) {

      const result = [];

      for (
        let column = 0;
        column < 5;
        column++
      ) {

        let row = "";

        for (
          let sourceRow = 4;
          sourceRow >= 0;
          sourceRow--
        ) {

          row +=
            matrix[sourceRow][column];

        }

        result.push(row);

      }

      return result;
    }


    function getRotation(
      matrix,
      side
    ) {

      let result = [...matrix];

      for (
        let i = 1;
        i < side;
        i++
      ) {

        result =
          rotate90(result);

      }

      return result;
    }


    const cardInfo = {

      R: {
        className: "red",
        emoji: "🔥"
      },

      B: {
        className: "blue",
        emoji: "❄️"
      },

      N: {
        className: "civilian",
        emoji: "🙂"
      },

      X: {
        className: "assassin",
        emoji: "☠️"
      }

    };


    function drawBoard(matrix) {

      board.innerHTML = "";

      for (
        let row = 0;
        row < 5;
        row++
      ) {

        for (
          let column = 0;
          column < 5;
          column++
        ) {

          const type =
            matrix[row][column];

          const info =
            cardInfo[type];


          const card =
            document.createElement("div");

          card.className =
            "card " +
            info.className;


          const emoji =
            document.createElement("span");

          emoji.className =
            "emoji";

          emoji.textContent =
            info.emoji;


          card.appendChild(
            emoji
          );

          board.appendChild(
            card
          );

        }

      }

    }


    function isValidSeed(seed) {

      return /^[0-9][1-4]$/.test(seed);

    }


    function openSeed(seed) {

      if (!isValidSeed(seed)) {

        seedInput.value =
          randomSeed();

        openSeed(
          seedInput.value
        );

        return;

      }


      const keyNumber =
        Number(seed[0]);

      const side =
        Number(seed[1]);


      const baseMatrix =
        baseKeys[keyNumber];


      const rotatedMatrix =
        getRotation(
          baseMatrix,
          side
        );


      drawBoard(
        rotatedMatrix
      );

    }


    function randomSeed() {

      const key =
        Math.floor(
          Math.random() * 10
        );

      const side =
        Math.floor(
          Math.random() * 4
        ) + 1;


      return (
        String(key) +
        String(side)
      );

    }


    function applySeed() {

      let seed =
        seedInput.value
          .replace(/\D/g, "")
          .slice(0, 2);


      if (!isValidSeed(seed)) {

        seed =
          randomSeed();

      }


      seedInput.value =
        seed;


      openSeed(seed);

    }


    seedInput.addEventListener(
      "input",
      () => {

        seedInput.value =
          seedInput.value
            .replace(/\D/g, "")
            .slice(0, 2);

      }
    );


    generateButton.addEventListener(
      "click",
      applySeed
    );


    seedInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          applySeed();

        }

      }
    );


    const initialSeed =
      randomSeed();


    seedInput.value =
      initialSeed;


    openSeed(
      initialSeed
    );

  </script>

</body>
</html>
